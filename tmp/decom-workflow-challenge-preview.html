:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;decom-quiz&quot;&gt;
  &lt;style&gt;
    #decom-quiz { color: var(--foreground); }
    #decom-quiz .quiz-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    #decom-quiz .progress-track { height:8px; background:var(--muted); border-radius:999px; overflow:hidden; flex:1; min-width:180px; }
    #decom-quiz .progress-fill { height:100%; width:0; background:var(--viz-series-1); transition:width .25s ease; }
    #decom-quiz .stage-list { display:grid; gap:8px; margin:14px 0; }
    #decom-quiz .stage-row { display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
    #decom-quiz .stage-number { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:color-mix(in srgb, var(--viz-series-1) 16%, transparent); }
    #decom-quiz .stage-actions { display:flex; gap:6px; }
    #decom-quiz .choice-grid { display:grid; gap:8px; margin:14px 0; }
    #decom-quiz .choice { text-align:left; justify-content:flex-start; white-space:normal; }
    #decom-quiz .feedback { margin-top:12px; padding:10px 0; border-top:1px solid var(--border); }
    #decom-quiz .feedback.good { color:var(--foreground); }
    #decom-quiz .feedback.bad { color:var(--destructive); }
    #decom-quiz .result-ring { width:132px; height:132px; margin:10px auto 18px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--viz-series-1) calc(var(--score) * 1%), var(--muted) 0); position:relative; }
    #decom-quiz .result-ring::after { content:&quot;&quot;; position:absolute; inset:12px; border-radius:50%; background:var(--card); }
    #decom-quiz .result-value { position:relative; z-index:1; text-align:center; }
    #decom-quiz .result-value strong { display:block; font-size:2rem; font-weight:500; }
    #decom-quiz .hidden { display:none; }
    #decom-quiz .shake { animation:shake .22s linear; }
    @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    @media (prefers-reduced-motion:reduce){ #decom-quiz .progress-fill{transition:none} #decom-quiz .shake{animation:none} }
    @media (max-width:480px){ #decom-quiz .stage-row{grid-template-columns:28px 1fr} #decom-quiz .stage-actions{grid-column:2} }
  &lt;/style&gt;

  &lt;div class=&quot;quiz-head&quot;&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;dq-step&quot;&gt;Challenge 1 of 5&lt;/span&gt;
    &lt;div class=&quot;progress-track&quot; aria-label=&quot;Quiz progress&quot;&gt;&lt;div class=&quot;progress-fill&quot; id=&quot;dq-progress&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;strong id=&quot;dq-score&quot;&gt;0 points&lt;/strong&gt;
  &lt;/div&gt;

  &lt;section class=&quot;card&quot; id=&quot;dq-panel&quot; aria-live=&quot;polite&quot;&gt;&lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;decom-quiz&#x27;);
  const panel = document.getElementById(&#x27;dq-panel&#x27;);
  const stepLabel = document.getElementById(&#x27;dq-step&#x27;);
  const progress = document.getElementById(&#x27;dq-progress&#x27;);
  const scoreLabel = document.getElementById(&#x27;dq-score&#x27;);
  const correctOrder = [
    &#x27;Quote issued + project number assigned&#x27;,
    &#x27;Project created and scheduled&#x27;,
    &#x27;Office PM, Field PM and vendor assigned&#x27;,
    &#x27;Client, access, crew and scope confirmed&#x27;,
    &#x27;Execution + Field PM submits FastField&#x27;,
    &#x27;WC report, completion email and closeout&#x27;
  ];
  let order = [...correctOrder].sort(() =&gt; Math.random() - 0.5);
  let index = 0;
  let points = 0;
  let locked = false;
  const questions = [
    {
      q:&#x27;A decom is scheduled for Monday, but the COI and loading-dock reservation are still unconfirmed. What is the correct status?&#x27;,
      choices:[&#x27;Ready for execution&#x27;,&#x27;Scheduled, but not fully confirmed&#x27;,&#x27;Completed because a date exists&#x27;,&#x27;Cancel the project&#x27;],
      answer:1,
      why:&#x27;A scheduled date does not prove access is ready. COI, dock/elevator and other building requirements must be confirmed before execution.&#x27;
    },
    {
      q:&#x27;Who submits the completed FastField after the crew performs the work?&#x27;,
      choices:[&#x27;The Account Manager&#x27;,&#x27;Claude&#x27;,&#x27;The Field PM&#x27;,&#x27;The client contact&#x27;],
      answer:2,
      why:&#x27;The Field PM is closest to execution and submits the mobile FastField. Claude may prepare a draft but cannot submit it.&#x27;
    },
    {
      q:&#x27;A vendor accidentally removed items outside the approved decom scope. Where should that issue automatically appear?&#x27;,
      choices:[&#x27;In every client completion email&#x27;,&#x27;In the internal project record and escalation path&#x27;,&#x27;On the client invoice&#x27;,&#x27;Nowhere; delete the evidence&#x27;],
      answer:1,
      why:&#x27;The issue must be preserved and escalated internally. Vendor problems stay out of client-facing communication unless the client needs to know.&#x27;
    },
    {
      q:&#x27;When can the project be marked completed?&#x27;,
      choices:[&#x27;As soon as the crew arrives&#x27;,&#x27;When the calendar date passes&#x27;,&#x27;After execution evidence, WC report and completion communication are actually handled&#x27;,&#x27;Immediately after the quote is approved&#x27;],
      answer:2,
      why:&#x27;Closeout follows real completion evidence. A past date or scheduled status is never enough by itself.&#x27;
    }
  ];

  function updateChrome() {
    const total = questions.length + 1;
    stepLabel.textContent = index &lt; total ? `Challenge ${index + 1} of ${total}` : &#x27;Complete&#x27;;
    progress.style.width = `${Math.min(index / total, 1) * 100}%`;
    scoreLabel.textContent = `${points} point${points === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
  }

  function renderOrder() {
    locked = false;
    panel.innerHTML = `
      &lt;h2&gt;Put the decom lifecycle in order&lt;/h2&gt;
      &lt;div class=&quot;text-muted&quot;&gt;Move each stage until the job flows from quote to closeout.&lt;/div&gt;
      &lt;div class=&quot;stage-list&quot; id=&quot;dq-order&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;viz-row&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;dq-check-order&quot;&gt;Check order&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;dq-shuffle&quot;&gt;Shuffle&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;dq-feedback&quot; class=&quot;feedback hidden&quot;&gt;&lt;/div&gt;`;
    drawStages();
    document.getElementById(&#x27;dq-check-order&#x27;).addEventListener(&#x27;click&#x27;, checkOrder);
    document.getElementById(&#x27;dq-shuffle&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { order.sort(() =&gt; Math.random() - 0.5); drawStages(); });
  }

  function drawStages() {
    const list = document.getElementById(&#x27;dq-order&#x27;);
    list.innerHTML = order.map((stage, i) =&gt; `
      &lt;div class=&quot;stage-row&quot;&gt;
        &lt;span class=&quot;stage-number&quot;&gt;${i + 1}&lt;/span&gt;
        &lt;span&gt;${stage}&lt;/span&gt;
        &lt;span class=&quot;stage-actions&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-up=&quot;${i}&quot; aria-label=&quot;Move ${stage} up&quot; ${i === 0 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;&lt;i data-lucide=&quot;arrow-up&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Up&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-down=&quot;${i}&quot; aria-label=&quot;Move ${stage} down&quot; ${i === order.length - 1 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;&lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Down&lt;/button&gt;
        &lt;/span&gt;
      &lt;/div&gt;`).join(&#x27;&#x27;);
    list.querySelectorAll(&#x27;[data-up]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; move(Number(b.dataset.up), -1)));
    list.querySelectorAll(&#x27;[data-down]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; move(Number(b.dataset.down), 1)));
    if (window.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }

  function move(i, delta) {
    const j = i + delta;
    [order[i], order[j]] = [order[j], order[i]];
    drawStages();
  }

  function checkOrder() {
    if (locked) return;
    const ok = order.every((v, i) =&gt; v === correctOrder[i]);
    const feedback = document.getElementById(&#x27;dq-feedback&#x27;);
    feedback.classList.remove(&#x27;hidden&#x27;,&#x27;good&#x27;,&#x27;bad&#x27;);
    if (ok) {
      locked = true; points += 2;
      feedback.classList.add(&#x27;good&#x27;);
      feedback.innerHTML = `&lt;strong&gt;Correct - 2 points.&lt;/strong&gt; The project number connects the entire flow, and closeout only happens after execution evidence and client completion communication.&lt;br&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;dq-next&quot;&gt;Next challenge&lt;/button&gt;`;
      document.getElementById(&#x27;dq-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { index++; renderQuestion(); });
    } else {
      feedback.classList.add(&#x27;bad&#x27;);
      feedback.textContent = &#x27;Not yet. Look for what creates the project first, what must be confirmed before the crew arrives, and what proves completion.&#x27;;
      panel.classList.remove(&#x27;shake&#x27;); void panel.offsetWidth; panel.classList.add(&#x27;shake&#x27;);
    }
    updateChrome();
  }

  function renderQuestion() {
    locked = false;
    const q = questions[index - 1];
    panel.innerHTML = `
      &lt;h2&gt;${q.q}&lt;/h2&gt;
      &lt;div class=&quot;choice-grid&quot;&gt;${q.choices.map((c,i) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn choice&quot; data-choice=&quot;${i}&quot;&gt;${String.fromCharCode(65+i)}. ${c}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;div id=&quot;dq-feedback&quot; class=&quot;feedback hidden&quot;&gt;&lt;/div&gt;`;
    panel.querySelectorAll(&#x27;[data-choice]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; answer(Number(b.dataset.choice), q)));
    updateChrome();
  }

  function answer(choice, q) {
    if (locked) return;
    locked = true;
    const ok = choice === q.answer;
    if (ok) points += 1;
    panel.querySelectorAll(&#x27;[data-choice]&#x27;).forEach((b,i) =&gt; {
      b.disabled = true;
      if (i === q.answer) b.classList.add(&#x27;btn-primary&#x27;);
    });
    const feedback = document.getElementById(&#x27;dq-feedback&#x27;);
    feedback.classList.remove(&#x27;hidden&#x27;);
    feedback.classList.add(ok ? &#x27;good&#x27; : &#x27;bad&#x27;);
    feedback.innerHTML = `&lt;strong&gt;${ok ? &#x27;Correct - 1 point.&#x27; : &#x27;Not quite.&#x27;}&lt;/strong&gt; ${q.why}&lt;br&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;dq-next&quot;&gt;${index === questions.length ? &#x27;See results&#x27; : &#x27;Next challenge&#x27;}&lt;/button&gt;`;
    document.getElementById(&#x27;dq-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { index++; index &gt; questions.length ? renderResults() : renderQuestion(); });
    updateChrome();
  }

  function renderResults() {
    const max = questions.length + 2;
    const pct = Math.round(points / max * 100);
    const label = pct &gt;= 85 ? &#x27;Project-ready&#x27; : pct &gt;= 65 ? &#x27;Strong start&#x27; : &#x27;Review the lifecycle&#x27;;
    stepLabel.textContent = &#x27;Complete&#x27;; progress.style.width = &#x27;100%&#x27;;
    panel.innerHTML = `
      &lt;div class=&quot;result-ring&quot; style=&quot;--score:${pct}&quot; role=&quot;img&quot; aria-label=&quot;Score ${points} out of ${max}&quot;&gt;&lt;div class=&quot;result-value&quot;&gt;&lt;strong&gt;${points}/${max}&lt;/strong&gt;&lt;span&gt;${pct}%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;h2 class=&quot;text-center&quot;&gt;${label}&lt;/h2&gt;
      &lt;div class=&quot;text-center text-muted&quot;&gt;Quote -&gt; schedule -&gt; assignments -&gt; confirmations -&gt; execution -&gt; closeout&lt;/div&gt;
      &lt;div class=&quot;viz-row&quot; style=&quot;justify-content:center; margin-top:16px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;dq-retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;`;
    document.getElementById(&#x27;dq-retry&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { index=0; points=0; order=[...correctOrder].sort(() =&gt; Math.random()-.5); updateChrome(); renderOrder(); });
  }

  updateChrome();
  renderOrder();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);

  const handlePointerOpen = (event) =&gt; {
